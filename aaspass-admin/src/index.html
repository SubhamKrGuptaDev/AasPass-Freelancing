<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AasPass Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before first paint (mirrors ThemeService; key must match THEME_STORAGE_KEY).
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('aaspass-admin-theme') || 'system'; } catch (e) {}
      var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
