<div class="min-h-screen md:flex">
  <aside class="border-b border-slate-200 bg-white md:w-56 md:shrink-0 md:border-b-0 md:border-r">
    <div class="flex items-center justify-between px-4 py-3">
      <span class="text-lg font-bold tracking-tight text-slate-900">AasPass Admin</span>
      <button
        hlmBtn
        variant="outline"
        type="button"
        class="md:hidden"
        aria-controls="admin-nav"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        Menu
      </button>
    </div>
    <nav
      id="admin-nav"
      aria-label="Admin"
      class="px-2 pb-3 md:block"
      [class.hidden]="!menuOpen()"
    >
      <ul class="flex flex-col gap-1">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-indigo-50 text-indigo-800 font-semibold"
              ariaCurrentWhenActive="page"
              class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
              (click)="closeMenu()"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex items-center justify-end gap-3 border-b border-slate-200 bg-white px-4 py-3">
      @if (auth.admin(); as admin) {
        <span class="text-sm text-slate-700">{{ admin.name }}</span>
      }
      <button hlmBtn variant="outline" type="button" (click)="logout()">Logout</button>
    </header>
    <main class="flex-1 p-4 md:p-6">
      <router-outlet />
    </main>
  </div>
</div>
