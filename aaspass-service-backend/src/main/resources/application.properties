spring.application.name=aaspass-service-backend


# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/aaspass?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# H2 DB Config
#spring.datasource.url=jdbc:h2:mem:aaspass
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=subham
#spring.datasource.password=root

# Security (JWT cookie auth + KYC encryption)
spring.profiles.default=dev
aaspass.security.cookie-domain=${AASPASS_COOKIE_DOMAIN:}
aaspass.security.access-token-ttl=PT15M
aaspass.security.refresh-token-ttl=P30D
aaspass.security.jwt-secret=${AASPASS_JWT_SECRET:}
aaspass.security.kyc-key=${AASPASS_KYC_KEY:}
