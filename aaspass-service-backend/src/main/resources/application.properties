spring.application.name=aaspass-service-backend


# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/aaspass?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Multipart uploads (profile pictures; the client resizes to 512x512 JPEG before upload)
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# H2 DB Config
#spring.datasource.url=jdbc:h2:mem:aaspass
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=subham
#spring.datasource.password=root

# Security (JWT cookie auth + KYC encryption)
spring.profiles.default=dev
aaspass.security.cookie-domain=${AASPASS_COOKIE_DOMAIN:}
aaspass.security.access-token-ttl=PT15M
aaspass.security.refresh-token-ttl=P30D
aaspass.security.jwt-secret=${AASPASS_JWT_SECRET:}
aaspass.security.kyc-key=${AASPASS_KYC_KEY:}

# Admin panel
aaspass.admin.jwt-secret=${AASPASS_ADMIN_JWT_SECRET:}
aaspass.admin.access-token-ttl=PT15M
aaspass.admin.refresh-token-ttl=PT12H
aaspass.admin.bootstrap-email=${AASPASS_ADMIN_EMAIL:}
aaspass.admin.bootstrap-password=${AASPASS_ADMIN_PASSWORD:}
aaspass.admin.bootstrap-name=${AASPASS_ADMIN_NAME:AasPass Admin}
aaspass.cors.allowed-origins=${AASPASS_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://localhost:4300,http://127.0.0.1:4300}
